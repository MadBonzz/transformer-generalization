[project]
name = "transformer-generalization"
version = "0.1.0"
description = "Small PyTorch grokking experiments for modular addition."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchvision",
    "tqdm",
    "matplotlib",
    "numpy",
    "pandas",
    "pymixbox==2.0.0",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/grokking_transformer"]
